name: Rebuild STATGOAT

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'head.html'
      - 'app.js'
      - 'champions.csv'
      - 'playoff_ppg_career.csv'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python fetch_sources.py

      - run: python statgoat_pipeline.py

      - run: python statgoat_compose.py

      - run: python export_web.py

      - run: python build_site.py

      - run: python verify_build.py

      - name: Publicar si algo ha cambiado
        run: |
          git config user.name "statgoat-bot"
          git config user.email "actions@github.com"
          git add index.html data.json build_info.json robots.txt
          if git diff --staged --quiet; then
            echo "Sin cambios esta semana."
          else
            git commit -m "rebuild automatico"
            git push
          fi
